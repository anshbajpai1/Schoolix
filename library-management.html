<script id="sxCriticalLoaderScript">
(function () {
  var root = document.documentElement;
  root.classList.add("sx-page-loading");
  window.SchoolixPageLoaderEarly = window.SchoolixPageLoaderEarly || { startedAt: Date.now() };

  function markEarlyReady(reason) {
    window.SchoolixPageLoaderEarly.ready = true;
    window.SchoolixPageLoaderEarly.reason = reason || "dom-ready";
    try {
      window.dispatchEvent(new CustomEvent("schoolix:critical-load-ready", { detail: window.SchoolixPageLoaderEarly }));
    } catch (_) {}
  }

  function afterFirstPaint(reason) {
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { markEarlyReady(reason); });
    });
  }

  function emergencyHide() {
    if (window.SchoolixPageLoader || !root.classList.contains("sx-page-loading")) return;
    root.classList.remove("sx-page-loading");
    root.classList.add("sx-page-loaded");
    var loader = document.getElementById("sxPageLoader");
    if (!loader) return;
    loader.classList.add("is-hidden");
    setTimeout(function () { loader.remove(); }, 260);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { afterFirstPaint("dom-ready"); }, { once: true });
  } else {
    afterFirstPaint(document.readyState === "complete" ? "document-complete" : "dom-ready");
  }
  window.addEventListener("load", function () { markEarlyReady("window-load"); }, { once: true });
  setTimeout(emergencyHide, 3200);
}());
</script>
<style id="sxCriticalLoaderStyle">
html.sx-page-loading,
html.sx-page-loading body {
  min-height: 100%;
  background: #ffffff !important;
}
html.sx-page-loading body::before,
html.sx-page-loading body::after {
  visibility: hidden !important;
}
html.sx-page-loading body > :not(#sxPageLoader):not(script):not(style) {
  visibility: hidden !important;
}
.sx-page-loader {
  position: fixed;
  inset: 0;
  z-index: 2147482500;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ffffff;
  transition: opacity 0.26s ease, visibility 0.26s ease;
}
.sx-page-loader.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.sx-page-loader .dots-container {
  display: flex;
  align-items: center;
  justify-content: center;
  width: min(180px, 54vw);
  height: 72px;
}
.sx-page-loader .dot {
  height: clamp(12px, 4vw, 20px);
  width: clamp(12px, 4vw, 20px);
  margin-right: clamp(7px, 2.3vw, 10px);
  border-radius: 999px;
  background-color: #b3d4fc;
  animation: pulse 1.5s infinite ease-in-out;
}
.sx-page-loader .dot:last-child { margin-right: 0; }
.sx-page-loader .dot:nth-child(1) { animation-delay: -0.3s; }
.sx-page-loader .dot:nth-child(2) { animation-delay: -0.1s; }
.sx-page-loader .dot:nth-child(3) { animation-delay: 0.1s; }
@keyframes pulse {
  0% {
    transform: scale(0.8);
    background-color: #b3d4fc;
    box-shadow: 0 0 0 0 rgba(178, 212, 252, 0.7);
  }
  50% {
    transform: scale(1.2);
    background-color: #6793fb;
    box-shadow: 0 0 0 clamp(7px, 2.6vw, 10px) rgba(178, 212, 252, 0);
  }
  100% {
    transform: scale(0.8);
    background-color: #b3d4fc;
    box-shadow: 0 0 0 0 rgba(178, 212, 252, 0.7);
  }
}
</style>

  <section class="dots-container" aria-label="Loading page">

<div class="container">

    <!-- Header -->
    <div class="card">
        <div class="header-row">
            <div>
                <h1>Library Staff Management</h1>
                <p class="muted">Create and manage librarian accounts.</p>
            </div>
        </div>
    </div>

    <!-- Add Librarian -->
    <div class="card">
        <h2 class="section-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>

        </h2>

            <div class="form-grid">
                <input type="text" id="librarianName" placeholder="Librarian Name" required>

                <input type="password" id="librarianPassword" placeholder="Set Password" required minlength="6">

    <!-- Librarians List -->
    <div class="card">

                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            Librarians List
        </h2>
        <div id="librarianList"></div>

<script src="school-branding.js"></script>
<script type="module">
import { initializeApp } from "./firebase-compat.js";
import {
    getAuth,
    createUserWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "./firebase-compat.js";
import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    getDocs,
    collection,
    deleteDoc,
    serverTimestamp,
    query,
    where
} from "./firebase-compat.js";

const firebaseConfig = {
    apiKey: "AIzaSyAomGwef93HFT9Xyx7SVW95FPw_IcIAICE",
    authDomain: "schoolix-48107.firebaseapp.com",
    projectId: "schoolix-48107",
    storageBucket: "schoolix-48107.firebasestorage.app",
    messagingSenderId: "133937954491",
    appId: "1:133937954491:web:69d8064422617eb8c4339e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Secondary app instance for creating new users without affecting admin session
const staffCreatorApp = initializeApp(firebaseConfig, "staffCreatorApp");
const staffCreatorAuth = getAuth(staffCreatorApp);

const librarianForm = document.getElementById("addLibrarianForm");
const librarianListEl = document.getElementById("librarianList");
let adminUID = null;

onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = "index.html";
        return;
    }

    const userDoc = await getDoc(doc(db, "users", user.uid));
    if (!userDoc.exists() || userDoc.data().role !== "admin") {
        alert("Access denied. Only admin can manage staff.");
        window.location.href = "index.html";
        return;
    }

    adminUID = user.uid;
    loadStaff("librarian", librarianListEl);
});

// ── Librarian form ──────────────────────────────────────────
librarianForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    await createStaff(
        "librarian",
        document.getElementById("librarianName").value.trim(),
        document.getElementById("librarianEmail").value.trim().toLowerCase(),
        document.getElementById("librarianPassword").value.trim(),
        librarianForm
    );
});

// ── Shared create function ───────────────────────────────────
async function createStaff(role, name, email, password, formEl) {
    const submitBtn = formEl.querySelector("button[type='submit']");
    const originalText = submitBtn.textContent;
    if (!name || !email || !password) {
        alert("Please fill all fields.");
        return;
    }
    try {
        submitBtn.disabled = true;
        submitBtn.textContent = "Creating...";
        const userCred = await createUserWithEmailAndPassword(staffCreatorAuth, email, password);
        const uid = userCred.user.uid;

        await setDoc(doc(db, "users", uid), {
            name,
            email,
            role,
            adminId: adminUID,
            schoolId: adminUID,
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
        });

        alert(`${capitalize(role)} account created successfully.`);
        formEl.reset();

        await loadStaff("librarian", librarianListEl);
    } catch (error) {
        alert(error.message);
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
    }
}

// ── Shared load function ─────────────────────────────────────
async function loadStaff(role, listEl) {
    if (!adminUID) return;
    listEl.innerHTML = `<div class="empty">Loading ${role}s...</div>`;
    try {
        const [adminSnap, schoolSnap] = await Promise.all([
            getDocs(query(collection(db, "users"), where("role", "==", role), where("adminId", "==", adminUID))),
            getDocs(query(collection(db, "users"), where("role", "==", role), where("schoolId", "==", adminUID)))
        ]);
        listEl.innerHTML = "";
        let count = 0;
        const seen = new Set();

        [...adminSnap.docs, ...schoolSnap.docs].forEach((docSnap) => {
            if (seen.has(docSnap.id)) return;
            seen.add(docSnap.id);
            const data = docSnap.data();
            count++;
            const row = document.createElement("div");
            row.className = "list-item";
            row.innerHTML = `
                <div class="list-meta">
                    <strong>${data.name || "N/A"}</strong><br>
                    ${data.email || "N/A"}<br>
                    <span class="badge badge-librarian">${capitalize(role)}</span>
                </div>
                <div class="item-actions">
                    <button class="secondary-btn" onclick="window.location.href='teacher-profile.html?id=${docSnap.id}'">View Profile</button>
                    <button class="danger-btn" onclick="deleteStaff('${docSnap.id}', '${role}')">Delete</button>
                </div>
            `;
            listEl.appendChild(row);
        });

        if (count === 0) {
            listEl.innerHTML = `<div class="empty">No ${role}s found.</div>`;
        }
    } catch (error) {
        console.error(`${role} load failed:`, error);
        listEl.innerHTML = `<div class="empty">Unable to load ${role}s: ${error.message}</div>`;
    }
}

// ── Delete ───────────────────────────────────────────────────
window.deleteStaff = async (uid, role) => {
    if (!confirm(`Delete ${role} record?`)) return;
    await deleteDoc(doc(db, "users", uid));
    alert(`${capitalize(role)} record deleted.`);
    loadStaff("librarian", librarianListEl);
};

// ── Logout ───────────────────────────────────────────────────
window.logout = async () => {
    try {
        await signOut(auth);
        window.location.href = "index.html";
    } catch (error) {
        alert("Logout failed.");
    }
};

function capitalize(str) {
    return str.charAt(0).toUpperCase() + str.slice(1);
}
</script>
<script type="module" src="access-control.js"></script>
