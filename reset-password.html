<!DOCTYPE html>
<html lang="en">
<head>
<script id="sxCriticalLoaderScript">
(function () {
  var root = document.documentElement;
  root.classList.add("sx-page-loading");
  window.SchoolixPageLoaderEarly = window.SchoolixPageLoaderEarly || { startedAt: Date.now() };

  function markEarlyReady(reason) {
    window.SchoolixPageLoaderEarly.ready = true;
    window.SchoolixPageLoaderEarly.reason = reason || "dom-ready";
    try {
      window.dispatchEvent(new CustomEvent("schoolix:critical-load-ready", { detail: window.SchoolixPageLoaderEarly }));
    } catch (_) {}
  }

  function afterFirstPaint(reason) {
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { markEarlyReady(reason); });
    });
  }

  function emergencyHide() {
    if (window.SchoolixPageLoader || !root.classList.contains("sx-page-loading")) return;
    root.classList.remove("sx-page-loading");
    root.classList.add("sx-page-loaded");
    var loader = document.getElementById("sxPageLoader");
    if (!loader) return;
    loader.classList.add("is-hidden");
    setTimeout(function () { loader.remove(); }, 260);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { afterFirstPaint("dom-ready"); }, { once: true });
  } else {
    afterFirstPaint(document.readyState === "complete" ? "document-complete" : "dom-ready");
  }
  window.addEventListener("load", function () { markEarlyReady("window-load"); }, { once: true });
  setTimeout(emergencyHide, 3200);
}());
</script>
<style id="sxCriticalLoaderStyle">
html.sx-page-loading,
html.sx-page-loading body {
  min-height: 100%;
  background: #f8fafc !important;
}
html.sx-page-loading body::before,
html.sx-page-loading body::after {
  visibility: hidden !important;
}
html.sx-page-loading body > :not(#sxPageLoader):not(script):not(style) {
  visibility: hidden !important;
}
.sx-page-loader {
  position: fixed;
  inset: 0;
  z-index: 2147482500;
  display: flex;
  align-items: stretch;
  justify-content: stretch;
  background: #f8fafc;
  transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.25s ease;
  overflow: hidden;
}
.sx-page-loader.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.sx-page-loader .dots-container {
  position: fixed;
  inset: 0;
  display: block;
  width: 100vw;
  height: 100vh;
  padding: 0;
  margin: 0;
  overflow: hidden;
  background: #f8fafc;
}
.sx-page-loader .dots-container::before,
.sx-page-loader .dots-container::after,
.sx-page-loader .dot {
  display: none !important;
}
</style>

<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Schoolix</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0e0f1a;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      padding: 24px;
    }
    .panel {
      width: min(420px, 100%);
      background: #13141f;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 28px;
    }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { margin: 0 0 22px; color: #a1a1aa; line-height: 1.5; }
    label { display: block; margin: 14px 0 8px; color: #cbd5e1; font-weight: 700; font-size: 14px; }
    input {
      width: 100%;
      height: 48px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: #1c1e2e;
      color: #fff;
      padding: 0 14px;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139,92,246,0.16); }
    button {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 10px;
      margin-top: 20px;
      color: #fff;
      background: #4f46e5;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.65; cursor: wait; }
    .msg {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(239,68,68,0.12);
      color: #fecaca;
      line-height: 1.45;
      font-size: 14px;
    }
    .msg.ok { background: rgba(34,197,94,0.12); color: #bbf7d0; }
    a { color: #c4b5fd; }
  </style>
  <link rel="stylesheet" href="schoolix-polish.css">
</head>
<body>
<div id="sxPageLoader" class="sx-page-loader" role="status" aria-live="polite">
  <section class="dots-container" aria-label="Loading page">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </section>
</div>
  <main class="panel">
    <h1>Reset Password</h1>
    <p>Choose a new password for your Schoolix account.</p>
    <form id="resetForm">
      <label for="password">New password</label>
      <input id="password" type="password" minlength="6" autocomplete="new-password" required>
      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required>
      <button id="submitBtn" type="submit">Update password</button>
    </form>
    <div id="message" class="msg"></div>
  </main>

  <script>
    const SUPABASE_URL = "https://ezkmeedcqetztkeppxil.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6a21lZWRjcWV0enRrZXBweGlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMjk5NjAsImV4cCI6MjA5MzcwNTk2MH0.1davJ_NYkFhHToUtcFBR0kA6dk0-cOkaIbK2SCObkQg";
    const token = new URLSearchParams(window.location.search).get("token") || "";
    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    function showMessage(text, ok = false) {
      message.textContent = text;
      message.className = `msg ${ok ? "ok" : ""}`;
      message.style.display = "block";
    }

    if (!token) {
      form.style.display = "none";
      showMessage("This reset link is missing or invalid.");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      if (password.length < 6) return showMessage("Password must be at least 6 characters.");
      if (password !== confirmPassword) return showMessage("Passwords do not match.");

      submitBtn.disabled = true;
      try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/complete-password-reset`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
          },
          body: JSON.stringify({ token, password })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "Password reset failed.");
        showMessage("Password updated successfully. You can now sign in with your new password.", true);
        form.reset();
        setTimeout(() => { window.location.href = "index.html"; }, 2200);
      } catch (error) {
        showMessage(error.message || "Password reset failed.");
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
  <script src="schoolix-polish.js" defer></script>
</body>
</html>
