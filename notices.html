<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schoolix Notices</title>
  <link rel="stylesheet" href="schoolix-polish.css">
  <link rel="stylesheet" href="admin-shell.css?v=navbar-20260721">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #667085;
      --line: #d9e2ef;
      --primary: #2563eb;
      --primary-soft: #eaf1ff;
      --success: #0f9f6e;
      --danger: #dc2626;
      --shadow: 0 18px 46px rgba(22, 33, 54, 0.11);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 38px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .crumb {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 38px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 680px;
      line-height: 1.55;
    }

    .role-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 999px;
      padding: 10px 14px;
      color: var(--muted);
      font-weight: 800;
      white-space: nowrap;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .panel-title {
      margin: 0;
      font-size: 18px;
      font-weight: 900;
    }

    .panel-body { padding: 20px; }

    .form-grid {
      display: grid;
      gap: 15px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #475467;
      font-weight: 800;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #cfd8e6;
      border-radius: 12px;
      padding: 12px 13px;
      font: inherit;
      color: var(--text);
      background: #fff;
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    textarea {
      resize: vertical;
      min-height: 132px;
      line-height: 1.45;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .file-box {
      border: 1px dashed #aebbd0;
      background: #f8fbff;
      border-radius: 14px;
      padding: 14px;
    }

    .file-box input { padding: 10px; background: #fff; }

    .hint {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 46px;
      transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn:disabled { opacity: .65; cursor: not-allowed; transform: none; }

    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, #2563eb, #0f9f6e);
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.24);
    }

    .btn-light {
      color: var(--text);
      background: #eef3f9;
      text-decoration: none;
    }

    .btn-danger {
      color: #b42318;
      background: #fff1f0;
      border: 1px solid #ffd5d1;
      min-height: 38px;
      padding: 8px 11px;
      box-shadow: none;
    }

    .notice-list {
      display: grid;
      gap: 14px;
    }

    .notice-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      background: #fff;
    }

    .notice-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .notice-title {
      margin: 0;
      font-size: 17px;
      line-height: 1.25;
      font-weight: 900;
    }

    .notice-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: #1d4ed8;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .notice-message {
      margin: 10px 0 0;
      color: #344054;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .notice-meta {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .pdf-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #b42318;
      background: #fff1f0;
      border: 1px solid #ffd5d1;
      border-radius: 10px;
      padding: 8px 10px;
      text-decoration: none;
      font-weight: 900;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 42px 18px;
      border: 1px dashed var(--line);
      border-radius: 16px;
      background: #fbfdff;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      max-width: min(430px, calc(100% - 36px));
      background: #172033;
      color: #fff;
      border-radius: 14px;
      padding: 13px 15px;
      box-shadow: 0 18px 38px rgba(15, 23, 42, 0.24);
      display: none;
      z-index: 20;
      font-weight: 800;
    }

    .toast.show { display: block; }
    .toast.error { background: var(--danger); }
    .toast.success { background: var(--success); }
    .composer-hidden .composer-panel { display: none; }
    .composer-hidden .layout { grid-template-columns: minmax(0, 1fr); }

    body.sx-admin-shell-enabled.sx-notices-app .page {
      padding-top: 0;
    }

    body.sx-admin-shell-enabled.sx-notices-app .topbar {
      display: none;
    }

    @media (max-width: 820px) {
      .page { width: min(100% - 22px, 1180px); padding-top: 16px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .layout { grid-template-columns: 1fr; }
      .panel-header, .panel-body { padding: 16px; }
      .notice-head { flex-direction: column; }
    }
  </style>
</head>
<body class="sx-admin-app sx-notices-app" data-sx-title="Notices">
  <main class="page" id="pageShell">
    <header class="topbar">
      <div>
        <a class="crumb" id="backLink" href="admin-dashboard.html"><i class="fa-solid fa-arrow-left"></i> Back</a>
        <h1>Notices</h1>
        <p class="subtitle">Publish school notices as text or PDF, choose the audience, and send an app alert instantly.</p>
      </div>
      <div class="role-pill"><i class="fa-solid fa-user-shield"></i><span id="roleLabel">Loading...</span></div>
    </header>

    <section class="layout">
      <article class="panel composer-panel">
        <div class="panel-header">
          <h2 class="panel-title">Create Notice</h2>
          <i class="fa-solid fa-bullhorn" aria-hidden="true"></i>
        </div>
        <div class="panel-body">
          <form class="form-grid" id="noticeForm">
            <div>
              <label for="audience">Send to</label>
              <select id="audience" required>
                <option value="all">Everyone</option>
                <option value="students">All Students</option>
                <option value="teachers">All Teachers</option>
                <option value="librarians">All Librarians</option>
                <option value="accountants">All Accountants</option>
              </select>
            </div>
            <div>
              <label for="noticeTitle">Notice title</label>
              <input id="noticeTitle" maxlength="120" placeholder="Example: Unit test schedule" required>
            </div>
            <div>
              <label for="noticeMessage">Notice message</label>
              <textarea id="noticeMessage" maxlength="2000" placeholder="Write the notice details here..."></textarea>
            </div>
            <div class="file-box">
              <label for="noticeFile">Attach PDF or image</label>
              <input id="noticeFile" type="file" accept="application/pdf,.pdf,image/png,image/jpeg,image/webp,image/gif">
              <p class="hint">Optional PDF/image, up to 10 MB. Files are stored securely with the notice.</p>
            </div>
            <button class="btn btn-primary" id="publishBtn" type="submit">
              <i class="fa-solid fa-paper-plane"></i>
              Publish Notice
            </button>
          </form>
        </div>
      </article>

      <article class="panel">
        <div class="panel-header">
          <h2 class="panel-title">Notice Board</h2>
          <button class="btn btn-light" id="refreshBtn" type="button"><i class="fa-solid fa-rotate"></i>Refresh</button>
        </div>
        <div class="panel-body">
          <div class="notice-list" id="noticeList">
            <div class="empty">Loading notices...</div>
          </div>
        </div>
      </article>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module">
    import { initializeApp, getApps } from "./firebase-compat.js";
    import { getAuth, onAuthStateChanged } from "./firebase-compat.js";
    import { getFirestore, doc, getDoc, collection, addDoc, getDocs, query, orderBy, limit, serverTimestamp, updateDoc } from "./firebase-compat.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAomGwef93HFT9Xyx7SVW95FPw_IcIAICE",
      authDomain: "schoolix-48107.firebaseapp.com",
      projectId: "schoolix-48107"
    };

    const SEND_URL = "https://ezkmeedcqetztkeppxil.supabase.co/functions/v1/send-app-notification";
    const ATTACHMENT_URL = "https://ezkmeedcqetztkeppxil.supabase.co/functions/v1/upload-notice-attachment";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6a21lZWRjcWV0enRrZXBweGlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMjk5NjAsImV4cCI6MjA5MzcwNTk2MH0.1davJ_NYkFhHToUtcFBR0kA6dk0-cOkaIbK2SCObkQg";
    const PDF_LIMIT = 10 * 1024 * 1024;

    const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = (id) => document.getElementById(id);
    const pageShell = $("pageShell");
    const noticeForm = $("noticeForm");
    const publishBtn = $("publishBtn");
    const noticeList = $("noticeList");
    const roleLabel = $("roleLabel");
    const backLink = $("backLink");
    let currentUser = null;
    let currentProfile = null;
    let schoolId = "";
    let role = "";
    let latestNotices = [];

    function toast(message, type = "") {
      const node = $("toast");
      node.textContent = message;
      node.className = `toast show ${type}`;
      window.clearTimeout(toast.timer);
      toast.timer = window.setTimeout(() => {
        node.className = "toast";
      }, 4200);
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function normalizeRole(value) {
      const clean = String(value || "").trim().toLowerCase();
      if (clean === "teacher" || clean === "teachers") return "teacher";
      if (clean === "student" || clean === "students" || clean === "parent") return "student";
      if (clean === "superadmin" || clean === "super admin") return "superadmin";
      return clean || "user";
    }

    function audienceLabel(value) {
      if (value === "teachers") return "Teachers";
      if (value === "students") return "Students";
      if (value === "librarians") return "Librarians";
      if (value === "accountants") return "Accountants";
      return "Everyone";
    }

    function audienceAllowed(value) {
      if (role === "admin" || role === "superadmin") return true;
      if (role === "teacher") return value === "all" || value === "teachers";
      if (role === "librarian") return value === "all" || value === "librarians";
      if (role === "accountant") return value === "all" || value === "accountants";
      return value === "all" || value === "students";
    }

    function formatDate(value) {
      const raw = value?.toDate ? value.toDate() : value ? new Date(value) : null;
      if (!raw || Number.isNaN(raw.getTime())) return "Just now";
      return raw.toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" });
    }

    function getStudentSession() {
      try { return JSON.parse(localStorage.getItem("schoolixStudentSession") || "null"); } catch { return null; }
    }

    async function getProfile(uid) {
      const snap = await getDoc(doc(db, "users", uid));
      return snap.exists() ? { id: snap.id, ...snap.data() } : null;
    }

    function resolveSchoolId(profile, user) {
      return String(
        profile?.schoolId ||
        profile?.adminId ||
        profile?.adminUID ||
        profile?.adminUid ||
        profile?.schoolUID ||
        profile?.schoolUid ||
        (normalizeRole(profile?.role) === "admin" ? user?.uid : "") ||
        profile?.id ||
        ""
      ).trim();
    }

    function configureForRole() {
      const canCompose = role === "admin" || role === "superadmin";
      pageShell.classList.toggle("composer-hidden", !canCompose);
      pageShell.classList.toggle("can-manage-notices", canCompose);
      roleLabel.textContent = role === "teacher" ? "Teacher" : role === "student" ? "Student" : "Admin";
      backLink.href = role === "teacher" ? "teacher-dashboard.html" : role === "student" ? "student-dashboard.html" : "admin-dashboard.html";
      document.title = canCompose ? "Schoolix Notices" : "Schoolix Notice Board";
    }

    function getAttachmentKind(file) {
      if (!file) return "";
      if (["image/png", "image/jpeg", "image/webp", "image/gif"].includes(file.type) || /\.(png|jpe?g|webp|gif)$/i.test(file.name)) return "image";
      if (file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf")) return "pdf";
      return "";
    }

    async function uploadAttachment(file) {
      if (!file) return {};
      if (file.size > PDF_LIMIT) throw new Error("Attachment 10 MB se chhoti honi chahiye.");
      const attachmentType = getAttachmentKind(file);
      if (!attachmentType) throw new Error("Sirf PDF ya image file upload kar sakte hain.");
      if (!currentUser) throw new Error("Attachment upload ke liye admin login required hai.");

      const idToken = await currentUser.getIdToken(true);
      const formData = new FormData();
      formData.append("file", file, file.name);
      formData.append("schoolId", schoolId);
      const response = await fetch(ATTACHMENT_URL, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          "apikey": SUPABASE_ANON_KEY,
          "x-firebase-token": idToken
        },
        body: formData
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok || !payload.attachmentUrl) {
        throw new Error(payload.error || "Attachment upload nahi ho paya.");
      }
      return {
        attachmentUrl: payload.attachmentUrl,
        attachmentName: payload.attachmentName || file.name,
        attachmentType: payload.attachmentType || attachmentType,
        attachmentPublicId: payload.storagePath || "",
        attachmentStoragePath: payload.storagePath || "",
        pdfUrl: attachmentType === "pdf" ? payload.attachmentUrl : "",
        pdfName: attachmentType === "pdf" ? (payload.attachmentName || file.name) : "",
        pdfPublicId: attachmentType === "pdf" ? (payload.storagePath || "") : ""
      };
    }

    async function deleteUploadedAttachment(storagePath) {
      if (!storagePath || !currentUser) return;
      const idToken = await currentUser.getIdToken();
      await fetch(ATTACHMENT_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          "apikey": SUPABASE_ANON_KEY,
          "x-firebase-token": idToken
        },
        body: JSON.stringify({ action: "delete", path: storagePath })
      });
    }

    async function sendNoticeNotification(title, message, audience) {
      const idToken = await currentUser.getIdToken(true);
      if (!["all", "students", "teachers"].includes(audience)) {
        return { skipped: true };
      }
      const response = await fetch(SEND_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          "apikey": SUPABASE_ANON_KEY,
          "x-firebase-token": idToken
        },
        body: JSON.stringify({
          title: "New Notice",
          message: title || message || "A new notice has been published.",
          audience
        })
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok || payload.success === false) {
        throw new Error(payload.error || payload.message || "Notification send nahi ho payi.");
      }
    }

    function renderNotices(items) {
      latestNotices = items;
      if (!items.length) {
        noticeList.innerHTML = '<div class="empty">No notices yet.</div>';
        return;
      }

      const canManage = role === "admin" || role === "superadmin";
      noticeList.innerHTML = items.map((notice) => {
        const title = escapeHtml(notice.title);
        const message = escapeHtml(notice.message);
        const attachmentUrl = notice.attachmentUrl || notice.pdfUrl || "";
        const attachmentName = notice.attachmentName || notice.pdfName || "Open attachment";
        const attachmentType = notice.attachmentType || (String(attachmentName).toLowerCase().match(/\.(png|jpe?g|webp|gif)$/) ? "image" : "pdf");
        const pdfLink = attachmentUrl
          ? `<a class="pdf-link" href="${escapeHtml(attachmentUrl)}" target="_blank" rel="noopener"><i class="fa-solid ${attachmentType === "image" ? "fa-image" : "fa-file-pdf"}"></i>${escapeHtml(attachmentName)}</a>`
          : "";
        return `
          <article class="notice-card">
            <div class="notice-head">
              <h3 class="notice-title">${title}</h3>
              <div class="notice-actions">
                <span class="badge"><i class="fa-solid fa-users"></i>${audienceLabel(notice.audience)}</span>
                ${canManage ? `<button class="btn btn-danger notice-delete-btn" type="button" data-notice-id="${escapeHtml(notice.id)}" title="Delete notice"><i class="fa-solid fa-trash"></i>Delete</button>` : ""}
              </div>
            </div>
            ${message ? `<p class="notice-message">${message}</p>` : ""}
            <div class="notice-meta">
              <span><i class="fa-regular fa-clock"></i> ${formatDate(notice.createdAt)}</span>
              ${pdfLink}
            </div>
          </article>
        `;
      }).join("");
    }

    async function loadNotices() {
      if (!schoolId) return;
      noticeList.innerHTML = '<div class="empty">Loading notices...</div>';
      const snap = await getDocs(query(collection(db, "schools", schoolId, "notices"), orderBy("createdAt", "desc"), limit(80)));
      const items = snap.docs.map((docSnap) => ({ id: docSnap.id, ...docSnap.data() }))
        .filter((notice) => notice.status !== "deleted")
        .filter((notice) => audienceAllowed(notice.audience || "all"));
      renderNotices(items);
    }

    async function deleteNotice(noticeId) {
      if (!(role === "admin" || role === "superadmin")) return;
      const notice = latestNotices.find((item) => item.id === noticeId);
      if (!notice) return toast("Notice nahi mila. Refresh karke try karo.", "error");
      const ok = window.confirm(`Delete notice "${notice.title || "Untitled"}"?`);
      if (!ok) return;

      const button = noticeList.querySelector(`[data-notice-id="${CSS.escape(noticeId)}"]`);
      if (button) {
        button.disabled = true;
        button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>Deleting...';
      }

      await updateDoc(doc(db, "schools", schoolId, "notices", noticeId), {
        status: "deleted",
        deletedAt: serverTimestamp(),
        deletedBy: currentUser?.uid || currentProfile?.id || "",
        deletedByEmail: currentUser?.email || currentProfile?.email || ""
      });

      const storagePath = notice.attachmentStoragePath || notice.attachmentPublicId || notice.pdfPublicId || "";
      if (storagePath) {
        await deleteUploadedAttachment(storagePath).catch((cleanupError) => console.warn("Attachment cleanup failed", cleanupError));
      }

      toast("Notice delete ho gaya.", "success");
      await loadNotices();
    }

    async function publishNotice(event) {
      event.preventDefault();
      if (!(role === "admin" || role === "superadmin")) return;
      const title = $("noticeTitle").value.trim();
      const message = $("noticeMessage").value.trim();
      const audience = $("audience").value;
      const file = $("noticeFile").files[0] || null;
      if (!title) return toast("Notice title required hai.", "error");
      if (!message && !file) return toast("Message likho ya PDF attach karo.", "error");

      publishBtn.disabled = true;
      publishBtn.innerHTML = file
        ? '<i class="fa-solid fa-spinner fa-spin"></i>Uploading attachment...'
        : '<i class="fa-solid fa-spinner fa-spin"></i>Publishing...';
      let upload = {};
      try {
        upload = await uploadAttachment(file);
        publishBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>Saving notice...';
        await addDoc(collection(db, "schools", schoolId, "notices"), {
          schoolId,
          title,
          message,
          audience,
          recipientRoles: audience === "all" ? ["students", "teachers", "librarians", "accountants"] : [audience],
          attachmentUrl: upload.attachmentUrl || "",
          attachmentName: upload.attachmentName || "",
          attachmentType: upload.attachmentType || "",
          attachmentPublicId: upload.attachmentPublicId || "",
          attachmentStoragePath: upload.attachmentStoragePath || "",
          pdfUrl: upload.pdfUrl || "",
          pdfName: upload.pdfName || "",
          pdfPublicId: upload.pdfPublicId || "",
          createdAt: serverTimestamp(),
          createdBy: currentUser?.uid || currentProfile?.id || "",
          createdByEmail: currentUser?.email || currentProfile?.email || "",
          status: "published"
        });

        try {
          const notificationResult = await sendNoticeNotification(title, message, audience);
          toast(notificationResult?.skipped ? "Notice publish ho gaya." : "Notice publish ho gaya aur app notification bhej di.", "success");
        } catch (notifyError) {
          console.warn("Notice saved but notification failed", notifyError);
          toast(`Notice saved, lekin notification nahi gayi: ${notifyError.message}`, "error");
        }

        noticeForm.reset();
        await loadNotices();
      } catch (error) {
        console.error(error);
        if (upload.attachmentStoragePath) {
          await deleteUploadedAttachment(upload.attachmentStoragePath).catch((cleanupError) => console.warn("Attachment cleanup failed", cleanupError));
        }
        toast(error.message || "Notice publish nahi ho paya.", "error");
      } finally {
        publishBtn.disabled = false;
        publishBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i>Publish Notice';
      }
    }

    async function bootWithProfile(user, profile) {
      currentUser = user;
      currentProfile = profile || {};
      role = normalizeRole(currentProfile.role || currentProfile.loginAs);
      schoolId = resolveSchoolId(currentProfile, user);
      if (!schoolId) {
        noticeList.innerHTML = '<div class="empty">School profile nahi mila. Please login again.</div>';
        return;
      }
      configureForRole();
      await loadNotices();
    }

    noticeForm.addEventListener("submit", publishNotice);
    $("refreshBtn").addEventListener("click", () => loadNotices().catch((error) => toast(error.message, "error")));
    noticeList.addEventListener("click", (event) => {
      const button = event.target.closest(".notice-delete-btn");
      if (!button) return;
      deleteNotice(button.dataset.noticeId).catch((error) => {
        console.error(error);
        toast(error.message || "Notice delete nahi ho paya.", "error");
        loadNotices().catch((loadError) => console.warn("Notice reload failed", loadError));
      });
    });

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        try {
          const profile = await getProfile(user.uid);
          await bootWithProfile(user, profile || { id: user.uid, role: "admin" });
        } catch (error) {
          console.error(error);
          toast("Profile load nahi ho paya.", "error");
        }
        return;
      }

      const session = getStudentSession();
      if (session?.schoolId || session?.adminId) {
        await bootWithProfile(null, { ...session, role: session.role || session.loginAs || "student" });
        return;
      }

      window.location.replace("index.html");
    });
  </script>
  <script type="module" src="access-control.js"></script>
  <script src="schoolix-polish.js"></script>
  <script src="admin-shell.js?v=navbar-20260721" defer></script>
