<!DOCTYPE html>
<html lang="en">
<head>
<script id="sxCriticalLoaderScript">
(function () {
  var root = document.documentElement;
  root.classList.add("sx-page-loading");
  window.SchoolixPageLoaderEarly = window.SchoolixPageLoaderEarly || { startedAt: Date.now() };

  function markEarlyReady(reason) {
    window.SchoolixPageLoaderEarly.ready = true;
    window.SchoolixPageLoaderEarly.reason = reason || "dom-ready";
    try {
      window.dispatchEvent(new CustomEvent("schoolix:critical-load-ready", { detail: window.SchoolixPageLoaderEarly }));
    } catch (_) {}
  }

  function afterFirstPaint(reason) {
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { markEarlyReady(reason); });
    });
  }

  function emergencyHide() {
    if (window.SchoolixPageLoader || !root.classList.contains("sx-page-loading")) return;
    root.classList.remove("sx-page-loading");
    root.classList.add("sx-page-loaded");
    var loader = document.getElementById("sxPageLoader");
    if (!loader) return;
    loader.classList.add("is-hidden");
    setTimeout(function () { loader.remove(); }, 260);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { afterFirstPaint("dom-ready"); }, { once: true });
  } else {
    afterFirstPaint(document.readyState === "complete" ? "document-complete" : "dom-ready");
  }
  window.addEventListener("load", function () { markEarlyReady("window-load"); }, { once: true });
  setTimeout(emergencyHide, 3200);
}());
</script>
<style id="sxCriticalLoaderStyle">
html.sx-page-loading,
html.sx-page-loading body {
  min-height: 100%;
  background: #f8fafc !important;
}
html.sx-page-loading body::before,
html.sx-page-loading body::after {
  visibility: hidden !important;
}
html.sx-page-loading body > :not(#sxPageLoader):not(script):not(style) {
  visibility: hidden !important;
}
.sx-page-loader {
  position: fixed;
  inset: 0;
  z-index: 2147482500;
  display: flex;
  align-items: stretch;
  justify-content: stretch;
  background: #f8fafc;
  transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.25s ease;
  overflow: hidden;
}
.sx-page-loader.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.sx-page-loader .dots-container {
  position: fixed;
  inset: 0;
  display: block;
  width: 100vw;
  height: 100vh;
  padding: 0;
  margin: 0;
  overflow: hidden;
  background: #f8fafc;
}
.sx-page-loader .dots-container::before,
.sx-page-loader .dots-container::after,
.sx-page-loader .dot {
  display: none !important;
}
</style>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
<link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080d14">
  <title>Schoolix Offline</title>
  <link rel="icon" href="/schoolix-app-icon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: #080d14;
      color: #e4ecff;
    }
    .offline-panel {
      width: min(460px, 100%);
      background: #0f1a2e;
      border: 1px solid rgba(148,180,255,0.14);
      border-radius: 16px;
      padding: 28px;
    }
    .mark {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(145deg, #2a5cff, #4f90ff);
      display: grid;
      place-items: center;
      margin-bottom: 18px;
    }
    .mark img { width: 34px; height: 34px; }
    h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: 0; }
    p { margin: 0 0 22px; color: #8fa8cc; line-height: 1.6; }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      background: #4f90ff;
      color: white;
      padding: 12px 14px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
  <link rel="stylesheet" href="schoolix-polish.css">
</head>
<body>
<div id="sxPageLoader" class="sx-page-loader" role="status" aria-live="polite">
  <section class="dots-container" aria-label="Loading page">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </section>
</div>
  <main class="offline-panel">
    <div class="mark"><img src="/schoolix-app-icon.svg" alt=""></div>
    <h1>You're offline</h1>
    <p>Schoolix is installed, but live records need an internet connection. Reconnect and retry.</p>
    <button type="button" onclick="location.reload()">Retry</button>
  </main>
  <script src="schoolix-polish.js" defer></script>
</body>
</html>
