<!DOCTYPE html>
<html lang="en">
<head>
<script id="sxCriticalLoaderScript">
(function () {
  var root = document.documentElement;
  root.classList.add("sx-page-loading");
  window.SchoolixPageLoaderEarly = window.SchoolixPageLoaderEarly || { startedAt: Date.now() };

  function markEarlyReady(reason) {
    window.SchoolixPageLoaderEarly.ready = true;
    window.SchoolixPageLoaderEarly.reason = reason || "dom-ready";
    try {
      window.dispatchEvent(new CustomEvent("schoolix:critical-load-ready", { detail: window.SchoolixPageLoaderEarly }));
    } catch (_) {}
  }

  function afterFirstPaint(reason) {
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { markEarlyReady(reason); });
    });
  }

  function emergencyHide() {
    if (window.SchoolixPageLoader || !root.classList.contains("sx-page-loading")) return;
    root.classList.remove("sx-page-loading");
    root.classList.add("sx-page-loaded");
    var loader = document.getElementById("sxPageLoader");
    if (!loader) return;
    loader.classList.add("is-hidden");
    setTimeout(function () { loader.remove(); }, 260);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { afterFirstPaint("dom-ready"); }, { once: true });
  } else {
    afterFirstPaint(document.readyState === "complete" ? "document-complete" : "dom-ready");
  }
  window.addEventListener("load", function () { markEarlyReady("window-load"); }, { once: true });
  setTimeout(emergencyHide, 3200);
}());
</script>
<style id="sxCriticalLoaderStyle">
html.sx-page-loading,
html.sx-page-loading body {
  min-height: 100%;
  background: #ffffff !important;
}
html.sx-page-loading body::before,
html.sx-page-loading body::after {
  visibility: hidden !important;
}
html.sx-page-loading body > :not(#sxPageLoader):not(script):not(style) {
  visibility: hidden !important;
}
.sx-page-loader {
  position: fixed;
  inset: 0;
  z-index: 2147482500;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ffffff;
  transition: opacity 0.26s ease, visibility 0.26s ease;
}
.sx-page-loader.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.sx-page-loader .dots-container {
  display: flex;
  align-items: center;
  justify-content: center;
  width: min(180px, 54vw);
  height: 72px;
}
.sx-page-loader .dot {
  height: clamp(12px, 4vw, 20px);
  width: clamp(12px, 4vw, 20px);
  margin-right: clamp(7px, 2.3vw, 10px);
  border-radius: 999px;
  background-color: #b3d4fc;
  animation: pulse 1.5s infinite ease-in-out;
}
.sx-page-loader .dot:last-child { margin-right: 0; }
.sx-page-loader .dot:nth-child(1) { animation-delay: -0.3s; }
.sx-page-loader .dot:nth-child(2) { animation-delay: -0.1s; }
.sx-page-loader .dot:nth-child(3) { animation-delay: 0.1s; }
@keyframes pulse {
  0% {
    transform: scale(0.8);
    background-color: #b3d4fc;
    box-shadow: 0 0 0 0 rgba(178, 212, 252, 0.7);
  }
  50% {
    transform: scale(1.2);
    background-color: #6793fb;
    box-shadow: 0 0 0 clamp(7px, 2.6vw, 10px) rgba(178, 212, 252, 0);
  }
  100% {
    transform: scale(0.8);
    background-color: #b3d4fc;
    box-shadow: 0 0 0 0 rgba(178, 212, 252, 0.7);
  }
}
</style>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
<link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080d14">
  <title>Schoolix Offline</title>
  <link rel="icon" href="/schoolix-app-icon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: #080d14;
      color: #e4ecff;
    }
    .offline-panel {
      width: min(460px, 100%);
      background: #0f1a2e;
      border: 1px solid rgba(148,180,255,0.14);
      border-radius: 16px;
      padding: 28px;
    }
    .mark {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(145deg, #2a5cff, #4f90ff);
      display: grid;
      place-items: center;
      margin-bottom: 18px;
    }
    .mark img { width: 34px; height: 34px; }
    h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: 0; }
    p { margin: 0 0 22px; color: #8fa8cc; line-height: 1.6; }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      background: #4f90ff;
      color: white;
      padding: 12px 14px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
  <link rel="stylesheet" href="schoolix-polish.css">
</head>
<body>
<div id="sxPageLoader" class="sx-page-loader" role="status" aria-live="polite">
  <section class="dots-container" aria-label="Loading page">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </section>
</div>
  <main class="offline-panel">
    <div class="mark"><img src="/schoolix-app-icon.svg" alt=""></div>
    <h1>You're offline</h1>
    <p>Schoolix is installed, but live records need an internet connection. Reconnect and retry.</p>
    <button type="button" onclick="location.reload()">Retry</button>
  </main>
  <script src="schoolix-polish.js" defer></script>
</body>
</html>
